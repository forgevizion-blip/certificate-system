<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathon Certificate Portal</title>
  <!-- pdf-lib library -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-text: #ffffff;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
      --radius: 12px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #ffffff;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--primary-text);
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .status-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .status-success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .status-error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .result-card {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.9rem;
    }

    .info-row:last-of-type {
      border-bottom: none;
      margin-bottom: 16px;
    }

    .info-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-value {
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .badge-valid {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .badge-invalid {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="main-card">
      <!-- Injected dynamically based on URL params -->
    </div>
    <div class="footer">
      Hackathon Certificate Verification &amp; Distribution Portal
    </div>
  </div>

  <script>
    /* ==========================================================================
       CONFIG
       Update these settings before deploying to GitHub Pages or production.
       ========================================================================== */
    const CONFIG = {
      // 1. The Web App URL deployed from Google Apps Script (Code.gs):
      APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzDevVjYbeCubs8UXXGcFmTY1eq2UKXb3wHleeIpVoJk21F1auz0XSy7Ow6LCXFBARdLQ/exec',

      // 2. The base URL of this hosted portal (used for verification links):
      SITE_URL: 'https://forgevizion-blip.github.io/certificate-system/',

      // 3. Certificate background image or PDF template (relative path):
      TEMPLATE_URL: 'certificate.png'
    };

    /* ==========================================================================
       UTILITIES & SECURITY
       ========================================================================== */
    function escapeText(str) {
      if (str === null || str === undefined) return '';
      return String(str);
    }

    function createElement(tag, className, textContent) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (textContent !== undefined && textContent !== null) {
        el.textContent = String(textContent);
      }
      return el;
    }

    /* ==========================================================================
       ROUTER
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const certId = urlParams.get('id');

      if (certId !== null && certId.trim() !== '') {
        renderVerificationView(certId.trim());
      } else {
        renderLookupView();
      }
    });

    /* ==========================================================================
       VIEW 1: LOOKUP MODE (No ?id= in URL)
       ========================================================================== */
    function renderLookupView() {
      const card = document.getElementById('main-card');
      card.innerHTML = '';

      const header = createElement('div', 'header');
      header.appendChild(createElement('h1', '', 'Certificate Portal'));
      header.appendChild(createElement('p', '', 'Enter your registration number to download your certificate'));
      card.appendChild(header);

      const form = createElement('form', '');
      form.id = 'lookup-form';

      const formGroup = createElement('div', 'form-group');
      const label = createElement('label', '', 'Registration Number');
      label.setAttribute('for', 'reg-input');

      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'reg-input';
      input.name = 'reg';
      input.placeholder = 'e.g. 00101';
      input.required = true;
      input.autocomplete = 'off';

      formGroup.appendChild(label);
      formGroup.appendChild(input);
      form.appendChild(formGroup);

      const submitBtn = createElement('button', 'btn', 'Find Certificate');
      submitBtn.type = 'submit';
      submitBtn.id = 'submit-btn';
      form.appendChild(submitBtn);

      card.appendChild(form);

      const messageArea = createElement('div', '');
      messageArea.id = 'message-area';
      card.appendChild(messageArea);

      const resultArea = createElement('div', '');
      resultArea.id = 'result-area';
      card.appendChild(resultArea);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const regVal = input.value.trim();
        if (!regVal) return;

        messageArea.innerHTML = '';
        resultArea.innerHTML = '';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Searching...';

        try {
          if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
            throw new Error('Please configure APPS_SCRIPT_URL at the top of index.html before searching.');
          }

          const fetchUrl = `${CONFIG.APPS_SCRIPT_URL}?action=lookup&reg=${encodeURIComponent(regVal)}`;
          const res = await fetch(fetchUrl);
          if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
          const data = await res.json();

          if (data && data.found) {
            showLookupResult(data);
          } else {
            showError(`No certificate found for registration "${escapeText(regVal)}". Please verify your number.`);
          }
        } catch (err) {
          console.error(err);
          showError(err.message || 'Unable to connect to certificate server. Please try again.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Find Certificate';
        }
      });
    }

    function showLookupResult(student) {
      const resultArea = document.getElementById('result-area');
      resultArea.innerHTML = '';

      const box = createElement('div', 'result-card');

      const rowName = createElement('div', 'info-row');
      rowName.appendChild(createElement('span', 'info-label', 'Student Name'));
      rowName.appendChild(createElement('span', 'info-value', student.name || 'N/A'));
      box.appendChild(rowName);

      const rowTeam = createElement('div', 'info-row');
      rowTeam.appendChild(createElement('span', 'info-label', 'Team'));
      rowTeam.appendChild(createElement('span', 'info-value', student.team || 'N/A'));
      box.appendChild(rowTeam);

      if (student.id) {
        const rowId = createElement('div', 'info-row');
        rowId.appendChild(createElement('span', 'info-label', 'Certificate ID'));
        rowId.appendChild(createElement('span', 'info-value', student.id));
        box.appendChild(rowId);
      }

      const downloadBtn = createElement('button', 'btn', 'Download PDF');
      downloadBtn.id = 'download-btn';
      downloadBtn.style.marginTop = '16px';
      downloadBtn.addEventListener('click', () => generateAndDownloadPdf(student, downloadBtn));

      box.appendChild(downloadBtn);
      resultArea.appendChild(box);
    }

    function showError(msg) {
      const messageArea = document.getElementById('message-area');
      messageArea.innerHTML = '';
      const errBox = createElement('div', 'status-box status-error', msg);
      messageArea.appendChild(errBox);
    }

    /* ==========================================================================
       VIEW 2: VERIFICATION MODE (?id=XXXX in URL)
       ========================================================================== */
    async function renderVerificationView(id) {
      const card = document.getElementById('main-card');
      card.innerHTML = '';

      const header = createElement('div', 'header');
      header.appendChild(createElement('h1', '', 'Certificate Verification'));
      header.appendChild(createElement('p', '', `Checking ID: ${escapeText(id)}`));
      card.appendChild(header);

      const loadingBox = createElement('div', 'status-box', '');
      loadingBox.innerHTML = '<span class="spinner" style="border-top-color: var(--primary); border-color: rgba(79,70,229,0.2);"></span> Verifying certificate...';
      loadingBox.style.textAlign = 'center';
      card.appendChild(loadingBox);

      try {
        if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
          throw new Error('Please configure APPS_SCRIPT_URL at the top of index.html before verifying.');
        }

        const verifyUrl = `${CONFIG.APPS_SCRIPT_URL}?action=verify&id=${encodeURIComponent(id)}`;
        const res = await fetch(verifyUrl);
        if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
        const data = await res.json();

        loadingBox.remove();

        if (data && data.valid) {
          const badge = createElement('div', 'badge badge-valid', 'Valid Certificate');
          card.appendChild(badge);

          const resultCard = createElement('div', 'result-card', '');
          resultCard.style.borderTop = 'none';
          resultCard.style.paddingTop = '0';

          const rowName = createElement('div', 'info-row');
          rowName.appendChild(createElement('span', 'info-label', 'Student Name'));
          rowName.appendChild(createElement('span', 'info-value', data.name || 'N/A'));
          resultCard.appendChild(rowName);

          const rowTeam = createElement('div', 'info-row');
          rowTeam.appendChild(createElement('span', 'info-label', 'Team'));
          rowTeam.appendChild(createElement('span', 'info-value', data.team || 'N/A'));
          resultCard.appendChild(rowTeam);

          const rowId = createElement('div', 'info-row');
          rowId.appendChild(createElement('span', 'info-label', 'Certificate ID'));
          rowId.appendChild(createElement('span', 'info-value', id));
          resultCard.appendChild(rowId);

          card.appendChild(resultCard);

          const successNotice = createElement('div', 'status-box status-success', 'This certificate is authentic and officially issued.');
          card.appendChild(successNotice);
        } else {
          const badge = createElement('div', 'badge badge-invalid', 'Not Valid');
          card.appendChild(badge);

          const errBox = createElement('div', 'status-box status-error', `No active certificate was found with ID: ${escapeText(id)}.`);
          card.appendChild(errBox);
        }
      } catch (err) {
        console.error(err);
        loadingBox.remove();
        const errBox = createElement('div', 'status-box status-error', err.message || 'Verification service unreachable.');
        card.appendChild(errBox);
      }

      const backBtn = createElement('a', 'btn btn-secondary', 'Back to Portal');
      backBtn.href = window.location.pathname;
      card.appendChild(backBtn);
    }

    /* ==========================================================================
       PDF GENERATION ENGINE (pdf-lib)
       ========================================================================== */
    async function loadTemplate(PDFDocument, targetUrl) {
      const candidates = targetUrl ? [targetUrl] : ['certificate.png', 'certificate.jpg'];

      for (const url of candidates) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const buffer = await res.arrayBuffer();
          const u8 = new Uint8Array(buffer);

          // PNG Header: 89 50 4E 47
          const isPng = u8[0] === 0x89 && u8[1] === 0x50 && u8[2] === 0x4E && u8[3] === 0x47;
          // JPEG Header: FF D8 FF
          const isJpg = u8[0] === 0xFF && u8[1] === 0xD8 && u8[2] === 0xFF;
          // PDF Header: %PDF (25 50 44 46)
          const isPdf = u8[0] === 0x25 && u8[1] === 0x50 && u8[2] === 0x44 && u8[3] === 0x46;

          if (isPng || isJpg) {
            const doc = await PDFDocument.create();
            const img = isPng ? await doc.embedPng(buffer) : await doc.embedJpg(buffer);
            const page = doc.addPage([img.width, img.height]);
            page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
            return { doc, page, width: img.width, height: img.height, isImage: true };
          } else if (isPdf) {
            const doc = await PDFDocument.load(buffer);
            const page = doc.getPages()[0];
            const size = page.getSize();
            return { doc, page, width: size.width, height: size.height, isImage: false };
          }
        } catch (e) {
          console.warn(`Template load attempt from "${url}" skipped:`, e);
        }
      }
      return null;
    }

    async function generateAndDownloadPdf(student, btnElement) {
      if (!window.PDFLib) {
        alert('PDF library is loading. Please check your connection and retry.');
        return;
      }

      const originalBtnText = btnElement.textContent;
      btnElement.disabled = true;
      btnElement.innerHTML = '<span class="spinner"></span>Generating Certificate...';

      try {
        const { PDFDocument, rgb, StandardFonts } = window.PDFLib;
        const templateInfo = await loadTemplate(PDFDocument, CONFIG.TEMPLATE_URL);

        let pdfDoc, page, width, height, isImage;

        if (templateInfo) {
          pdfDoc = templateInfo.doc;
          page = templateInfo.page;
          width = templateInfo.width;
          height = templateInfo.height;
          isImage = templateInfo.isImage;
        } else {
          // Fallback: Create clean vector certificate
          pdfDoc = await PDFDocument.create();
          page = pdfDoc.addPage([842, 595]); // A4 Landscape
          const size = page.getSize();
          width = size.width;
          height = size.height;
          isImage = false;

          // Double border
          page.drawRectangle({
            x: 24,
            y: 24,
            width: width - 48,
            height: height - 48,
            borderColor: rgb(0.12, 0.16, 0.28),
            borderWidth: 2,
            color: rgb(0.99, 0.99, 1.0)
          });
          page.drawRectangle({
            x: 32,
            y: 32,
            width: width - 64,
            height: height - 64,
            borderColor: rgb(0.78, 0.82, 0.88),
            borderWidth: 1
          });
        }

        const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
        const fontRegular = await pdfDoc.embedFont(StandardFonts.Helvetica);

        // Responsive font scaling based on canvas width
        const scale = width / 842;

        if (!templateInfo) {
          // Default vector headers
          const title = 'CERTIFICATE OF PARTICIPATION';
          const titleSize = Math.round(26 * scale);
          const titleWidth = fontBold.widthOfTextAtSize(title, titleSize);
          page.drawText(title, {
            x: (width - titleWidth) / 2,
            y: height - 100 * scale,
            size: titleSize,
            font: fontBold,
            color: rgb(0.12, 0.16, 0.28)
          });

          const subtitle = 'This certificate is proudly presented to';
          const subSize = Math.round(14 * scale);
          const subWidth = fontRegular.widthOfTextAtSize(subtitle, subSize);
          page.drawText(subtitle, {
            x: (width - subWidth) / 2,
            y: height - 150 * scale,
            size: subSize,
            font: fontRegular,
            color: rgb(0.42, 0.48, 0.55)
          });
        }

        // Student Name
        const studentName = student.name || 'Participant';
        const nameSize = Math.round(32 * scale);
        const nameWidth = fontBold.widthOfTextAtSize(studentName, nameSize);
        const nameY = height * 0.54;

        page.drawText(studentName, {
          x: (width - nameWidth) / 2,
          y: nameY,
          size: nameSize,
          font: fontBold,
          color: rgb(0.12, 0.2, 0.55)
        });

        // Underline
        const lineMargin = 30 * scale;
        page.drawLine({
          start: { x: Math.max(60, (width - nameWidth) / 2 - lineMargin), y: nameY - 8 * scale },
          end: { x: Math.min(width - 60, (width + nameWidth) / 2 + lineMargin), y: nameY - 8 * scale },
          thickness: Math.max(1, 1.5 * scale),
          color: rgb(0.75, 0.8, 0.88)
        });

        // Team Recognition
        if (student.team) {
          const teamText = `Team: ${student.team}`;
          const teamSize = Math.round(16 * scale);
          const teamWidth = fontRegular.widthOfTextAtSize(teamText, teamSize);
          page.drawText(teamText, {
            x: (width - teamWidth) / 2,
            y: nameY - 45 * scale,
            size: teamSize,
            font: fontRegular,
            color: rgb(0.2, 0.25, 0.3)
          });
        }

        if (!templateInfo) {
          const desc = 'in recognition of valuable contribution and active participation in the Hackathon.';
          const descSize = Math.round(13 * scale);
          const descWidth = fontRegular.widthOfTextAtSize(desc, descSize);
          page.drawText(desc, {
            x: (width - descWidth) / 2,
            y: nameY - 80 * scale,
            size: descSize,
            font: fontRegular,
            color: rgb(0.4, 0.45, 0.5)
          });
        }

        // Bottom Left: Certificate ID
        const certIdText = `Certificate ID: ${student.id || 'N/A'}`;
        const metaSize = Math.round(10 * scale);
        page.drawText(certIdText, {
          x: 40 * scale,
          y: 40 * scale,
          size: metaSize,
          font: fontRegular,
          color: rgb(0.45, 0.5, 0.55)
        });

        // Bottom Right: Verification Link
        const verifyBase = CONFIG.SITE_URL || window.location.href.split('?')[0];
        const verifyUrl = `${verifyBase}${verifyBase.includes('?') ? '&' : '?'}id=${encodeURIComponent(student.id || '')}`;
        const verifyText = `Verify authenticity: ${verifyUrl}`;
        const verifySize = Math.round(9 * scale);
        const verifyWidth = fontRegular.widthOfTextAtSize(verifyText, verifySize);
        page.drawText(verifyText, {
          x: Math.max(40 * scale, width - verifyWidth - 40 * scale),
          y: 40 * scale,
          size: verifySize,
          font: fontRegular,
          color: rgb(0.45, 0.5, 0.55)
        });

        // Trigger Download
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        const safeFilename = (student.name || 'Certificate').replace(/[^a-zA-Z0-9_-]/g, '_');
        downloadAnchor.href = downloadUrl;
        downloadAnchor.download = `Certificate_${safeFilename}.pdf`;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
        URL.revokeObjectURL(downloadUrl);
      } catch (err) {
        console.error('PDF generation error:', err);
        alert('Failed to generate PDF. Please try again.');
      } finally {
        btnElement.disabled = false;
        btnElement.textContent = originalBtnText;
      }
    }
  </script>
</body>
</html>
